<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WAIC | 景德镇茶杯出海 AI 小明可视化 Demo</title>
  <style>
    :root {
      --bg: #f6f7f8;
      --surface: #ffffff;
      --surface-2: #eef3f1;
      --ink: #18201f;
      --muted: #64706d;
      --line: #d7dedb;
      --teal: #0f8b83;
      --green: #2f8f5b;
      --amber: #c77b21;
      --red: #c94a3a;
      --blue: #3b6ea8;
      --shadow: 0 14px 36px rgba(31, 43, 40, 0.10);
      --radius: 8px;
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, #ffffff 0%, #f6f7f8 38%, #eef3f1 100%);
    }

    button {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(220px, 1.2fr) repeat(4, minmax(120px, 0.6fr));
      gap: 12px;
      align-items: stretch;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.92);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 5;
      backdrop-filter: blur(10px);
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .brand strong {
      font-size: 17px;
      line-height: 1.3;
    }

    .brand span {
      color: var(--muted);
      font-size: 12px;
    }

    .stat {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px 12px;
      min-width: 0;
    }

    .stat label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 4px;
    }

    .stat strong {
      display: block;
      font-size: 16px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .workbench {
      display: grid;
      grid-template-columns: 240px minmax(420px, 1fr) 390px;
      gap: 16px;
      padding: 16px;
      min-height: 0;
    }

    .rail,
    .stage,
    .side {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      min-height: 0;
    }

    .rail {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .rail-title,
    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-weight: 700;
      font-size: 14px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      border: 1px solid var(--line);
      padding: 5px 8px;
      color: var(--muted);
      background: #fbfcfc;
      font-size: 11px;
      white-space: nowrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      flex: 0 0 auto;
    }

    .agent-list {
      display: grid;
      gap: 8px;
    }

    .agent {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px;
      background: #fbfcfc;
      transition: 180ms ease;
    }

    .agent.active {
      border-color: rgba(15, 139, 131, 0.48);
      background: #edf8f6;
    }

    .agent.done {
      border-color: rgba(47, 143, 91, 0.45);
      background: #f0f7f2;
    }

    .agent-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
    }

    .agent-name {
      font-weight: 700;
      font-size: 13px;
      line-height: 1.35;
    }

    .agent-status {
      color: var(--muted);
      font-size: 11px;
      flex: 0 0 auto;
    }

    .agent-steps {
      display: grid;
      gap: 4px;
      margin-top: 8px;
    }

    .agent-step {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
      display: flex;
      gap: 6px;
      align-items: flex-start;
    }

    .agent-step::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      margin-top: 6px;
      background: #a8b4b0;
      flex: 0 0 auto;
    }

    .agent.active .agent-step::before,
    .agent.done .agent-step::before {
      background: var(--teal);
    }

    .handoff {
      border-top: 1px solid var(--line);
      padding-top: 12px;
      display: grid;
      gap: 8px;
    }

    .handoff-item {
      display: grid;
      grid-template-columns: 20px 1fr;
      gap: 8px;
      align-items: start;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .handoff-index {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #e5ebe8;
      color: #4c5a56;
      font-size: 11px;
      font-weight: 700;
    }

    .handoff-item.active {
      color: var(--ink);
      font-weight: 700;
    }

    .handoff-item.active .handoff-index {
      background: var(--teal);
      color: white;
    }

    .stage {
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      overflow: hidden;
    }

    .scene-head {
      padding: 16px 18px 12px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
    }

    .scene-kicker {
      color: var(--teal);
      font-weight: 700;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .scene-title {
      font-size: 24px;
      line-height: 1.25;
      margin: 0 0 8px;
    }

    .scene-summary {
      color: var(--muted);
      line-height: 1.55;
      font-size: 13px;
      margin: 0;
    }

    .timer {
      min-width: 92px;
      text-align: center;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px;
      background: var(--surface-2);
    }

    .timer strong {
      display: block;
      font-size: 18px;
    }

    .timer span {
      color: var(--muted);
      font-size: 11px;
    }

    .timeline {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfc;
    }

    .tick {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: white;
      padding: 8px 6px;
      cursor: pointer;
      color: var(--muted);
      text-align: left;
      min-height: 58px;
    }

    .tick.active {
      border-color: var(--teal);
      color: var(--ink);
      background: #edf8f6;
    }

    .tick strong {
      display: block;
      font-size: 11px;
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tick span {
      display: block;
      font-size: 10px;
      line-height: 1.3;
    }

    .conversation {
      padding: 18px;
      display: grid;
      grid-template-columns: 1fr 220px;
      gap: 16px;
      overflow: auto;
      min-height: 0;
    }

    .chat {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
    }

    .bubble {
      border-radius: var(--radius);
      padding: 12px 13px;
      line-height: 1.55;
      font-size: 13px;
      border: 1px solid var(--line);
      background: white;
    }

    .bubble.user {
      border-color: rgba(59, 110, 168, 0.35);
      background: #f0f5fb;
    }

    .bubble.agent-bubble {
      border-color: rgba(15, 139, 131, 0.34);
      background: #eff9f7;
    }

    .bubble strong {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
      color: #33413e;
    }

    .mini-board {
      display: grid;
      gap: 10px;
      align-content: start;
    }

    .mini-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 11px;
      background: #fbfcfc;
    }

    .mini-card label {
      color: var(--muted);
      display: block;
      font-size: 11px;
      margin-bottom: 5px;
    }

    .mini-card strong {
      font-size: 15px;
      line-height: 1.3;
    }

    .progress {
      height: 8px;
      border-radius: 999px;
      background: #dfe7e4;
      overflow: hidden;
      margin-top: 8px;
    }

    .progress span {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--teal), var(--green));
      transition: width 240ms ease;
    }

    .controls {
      padding: 12px 18px;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #fbfcfc;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .button {
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
      border-radius: var(--radius);
      padding: 9px 12px;
      cursor: pointer;
      min-height: 38px;
    }

    .button.primary {
      border-color: var(--teal);
      background: var(--teal);
      color: white;
      font-weight: 700;
    }

    .button:focus-visible,
    .tick:focus-visible {
      outline: 3px solid rgba(15, 139, 131, 0.26);
      outline-offset: 2px;
    }

    .side {
      display: grid;
      grid-template-rows: auto 180px 1fr;
      overflow: hidden;
    }

    .side-section {
      padding: 14px;
      border-bottom: 1px solid var(--line);
      min-width: 0;
    }

    .route-map {
      position: relative;
      height: 150px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(90deg, rgba(15, 139, 131, 0.10) 0%, rgba(59, 110, 168, 0.08) 55%, rgba(199, 123, 33, 0.10) 100%),
        #fbfcfc;
      overflow: hidden;
      margin-top: 10px;
    }

    .route-line {
      position: absolute;
      left: 12%;
      right: 13%;
      top: 74px;
      height: 3px;
      background: #c7d2cf;
    }

    .route-line span {
      display: block;
      height: 100%;
      width: 0%;
      background: var(--teal);
      transition: width 260ms ease;
    }

    .place {
      position: absolute;
      transform: translate(-50%, -50%);
      display: grid;
      gap: 6px;
      justify-items: center;
      min-width: 82px;
    }

    .place i {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: white;
      border: 4px solid var(--teal);
      box-shadow: 0 0 0 5px rgba(15, 139, 131, 0.12);
    }

    .place span {
      font-size: 11px;
      color: #2f3d3a;
      text-align: center;
      line-height: 1.25;
    }

    .place.jdz { left: 14%; top: 74px; }
    .place.port { left: 49%; top: 74px; }
    .place.la { left: 86%; top: 74px; }

    .cards {
      overflow: auto;
      padding: 14px;
      display: grid;
      gap: 10px;
      align-content: start;
      min-height: 0;
    }

    .result-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: white;
      padding: 12px;
    }

    .result-card h3 {
      margin: 0 0 8px;
      font-size: 14px;
    }

    .result-card p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .result-card ul {
      margin: 8px 0 0;
      padding-left: 18px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .tag {
      border-radius: 999px;
      border: 1px solid #d5dfdc;
      color: #475653;
      background: #fbfcfc;
      padding: 4px 7px;
      font-size: 11px;
    }

    .tag.green { border-color: rgba(47, 143, 91, 0.35); color: var(--green); background: #eff8f2; }
    .tag.amber { border-color: rgba(199, 123, 33, 0.35); color: var(--amber); background: #fff7ed; }
    .tag.blue { border-color: rgba(59, 110, 168, 0.35); color: var(--blue); background: #f0f5fb; }

    @media (max-width: 1180px) {
      .workbench {
        grid-template-columns: 210px minmax(360px, 1fr);
      }

      .side {
        grid-column: 1 / -1;
        grid-template-rows: auto 180px auto;
      }
    }

    @media (max-width: 820px) {
      .topbar {
        grid-template-columns: 1fr 1fr;
      }

      .brand {
        grid-column: 1 / -1;
      }

      .workbench {
        grid-template-columns: 1fr;
        padding: 10px;
      }

      .conversation {
        grid-template-columns: 1fr;
      }

      .timeline {
        grid-template-columns: 1fr 1fr;
      }

      .scene-head,
      .controls {
        flex-direction: column;
        align-items: stretch;
      }

      .timer {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <strong>明心数智 · 景德镇茶杯出海 Demo</strong>
        <span>六位 AI 小明 · 四个接力点 · 五分钟业务闭环</span>
      </div>
      <div class="stat">
        <label>订单</label>
        <strong id="orderId">JDZ-LA-260ML</strong>
      </div>
      <div class="stat">
        <label>目的地</label>
        <strong>Los Angeles, CA</strong>
      </div>
      <div class="stat">
        <label>风险状态</label>
        <strong id="riskState">待评估</strong>
      </div>
      <div class="stat">
        <label>净利预测</label>
        <strong id="profitState">待核算</strong>
      </div>
    </header>

    <section class="workbench">
      <aside class="rail">
        <div class="rail-title">
          <span>AI 小明矩阵</span>
          <span class="pill"><span class="dot"></span>3 步模式</span>
        </div>
        <div class="agent-list" id="agentList"></div>
        <div class="handoff">
          <div class="rail-title"><span>节俭接力链路</span></div>
          <div id="handoffList"></div>
        </div>
      </aside>

      <section class="stage">
        <div class="scene-head">
          <div>
            <div class="scene-kicker" id="sceneKicker">Scene 0</div>
            <h1 class="scene-title" id="sceneTitle">目标输入与主控拆解</h1>
            <p class="scene-summary" id="sceneSummary">观众输入商业目标，主控编排小明把任务拆成六个模块。</p>
          </div>
          <div class="timer">
            <strong id="sceneTime">0:00-0:30</strong>
            <span>现场节拍</span>
          </div>
        </div>

        <nav class="timeline" id="timeline" aria-label="Demo 时间线"></nav>

        <div class="conversation">
          <div class="chat" id="chat"></div>
          <div class="mini-board">
            <div class="mini-card">
              <label>当前主导</label>
              <strong id="currentAgent">主控编排小明</strong>
            </div>
            <div class="mini-card">
              <label>接力进度</label>
              <strong id="handoffProgress">主控派单</strong>
              <div class="progress"><span id="handoffBar"></span></div>
            </div>
            <div class="mini-card">
              <label>本场景输出</label>
              <strong id="sceneOutput">任务计划</strong>
            </div>
          </div>
        </div>

        <div class="controls">
          <div class="btn-row">
            <button class="button" id="prevBtn" type="button">上一步</button>
            <button class="button" id="nextBtn" type="button">下一步</button>
          </div>
          <button class="button primary" id="actionBtn" type="button">开始交付</button>
        </div>
      </section>

      <aside class="side">
        <div class="side-section">
          <div class="panel-title">
            <span>在途链路</span>
            <span class="pill" id="routeMode">待启动</span>
          </div>
          <div class="route-map" aria-label="景德镇到洛杉矶路线示意">
            <div class="route-line"><span id="routeProgress"></span></div>
            <div class="place jdz"><i></i><span>景德镇<br>工厂端</span></div>
            <div class="place port"><i></i><span>盐田/广州<br>出境口岸</span></div>
            <div class="place la"><i></i><span>洛杉矶<br>C 端买家</span></div>
          </div>
        </div>
        <div class="cards" id="cards"></div>
      </aside>
    </section>
  </main>

  <script>
    const agents = [
      {
        id: "orchestrator",
        name: "主控编排小明",
        steps: ["识别业务目标", "拆解六个模块", "控制四个接力点"]

      {

    const scenes = [

        ]
      },
      {
        title: "景德镇端：SKU 与融资",
        time: "0:30-1:10",

        handoff: 0,
        route: 18,

        summary: "经营评估小明把 SKU、包装、履约与资金缺口压缩成 3 步展示。",
        chat: [

          ["agent", "履约风险可控。采购账期与回款周期存在 ¥42,000 资金缺口，建议封装订单真实性证据申请低时延贸易融资。"]
        ],

    let current = 0;

    const agentList = document.getElementById("agentList");
    const handoffList = document.getElementById("handoffList");
    const timeline = document.getElementById("timeline");
    const chat = document.getElementById("chat");
    const cards = document.getElementById("cards");

    function makeAgents() {
      agentList.innerHTML = agents.map(agent => `
        <article class="agent" data-agent="${agent.id}">
          <div class="agent-head">
            <span class="agent-name">${agent.name}</span>
            <span class="agent-status">待命</span>
          </div>
          <div class="agent-steps">
            ${agent.steps.map(step => `<span class="agent-step">${step}</span>`).join("")}
          </div>
        </article>
      `).join("");
    }

    function makeHandoffs() {
      handoffList.innerHTML = handoffs.map((item, index) => `
        <div class="handoff-item" data-handoff="${index}">
          <span class="handoff-index">${index + 1}</span>
          <span>${item}</span>
        </div>
      `).join("");
    }

    function makeTimeline() {
      timeline.innerHTML = scenes.map((scene, index) => `
        <button class="tick" type="button" data-scene="${index}">
          <strong>${scene.time}</strong>
          <span>${scene.title}</span>
        </button>
      `).join("");
      timeline.querySelectorAll(".tick").forEach(button => {
        button.addEventListener("click", () => {
          current = Number(button.dataset.scene);
          render();
        });
      });
    }

    function renderAgents(scene) {
      document.querySelectorAll(".agent").forEach((node) => {
        const index = agents.findIndex(agent => agent.id === node.dataset.agent);
        const activeIndex = agents.findIndex(agent => agent.id === scene.agent);
        node.classList.toggle("active", node.dataset.agent === scene.agent);
        node.classList.toggle("done", index < activeIndex || current === scenes.length - 1);
        const status = node.querySelector(".agent-status");
        if (node.dataset.agent === scene.agent) {
          status.textContent = "处理中";
        } else if (index < activeIndex || current === scenes.length - 1) {
          status.textContent = "已完成";
        } else {
          status.textContent = "待命";
        }
      });
    }

    function renderHandoffs(scene) {
      document.querySelectorAll(".handoff-item").forEach(node => {
        node.classList.toggle("active", Number(node.dataset.handoff) <= scene.handoff);
      });
    }

    function renderCards(scene) {
      cards.innerHTML = scene.cards.map(([title, body, tags]) => `
        <article class="result-card">
          <h3>${title}</h3>
          <p>${body}</p>
          <div class="tag-row">
            ${tags.map((tag, index) => `<span class="tag ${index === 0 ? "green" : index === 1 ? "blue" : "amber"}">${tag}</span>`).join("")}
          </div>
        </article>
      `).join("");
    }

    function renderChat(scene) {
      chat.innerHTML = scene.chat.map(([speaker, text]) => `
        <div class="bubble ${speaker === "user" ? "user" : "agent-bubble"}">
          <strong>${speaker === "user" ? "观众" : scene.agent === "orchestrator" ? "主控编排小明" : document.getElementById("currentAgent").textContent}</strong>
          ${text}
        </div>
      `).join("");
    }

    function render() {
      const scene = scenes[current];
      const agent = agents.find(item => item.id === scene.agent);
      document.getElementById("sceneKicker").textContent = `Scene ${current}`;
      document.getElementById("sceneTitle").textContent = scene.title;
      document.getElementById("sceneSummary").textContent = scene.summary;
      document.getElementById("sceneTime").textContent = scene.time;
      document.getElementById("currentAgent").textContent = agent.name;
      document.getElementById("handoffProgress").textContent = handoffs[scene.handoff].split("：")[0];
      document.getElementById("sceneOutput").textContent = scene.output;
      document.getElementById("riskState").textContent = scene.risk;
      document.getElementById("profitState").textContent = scene.profit;
      document.getElementById("routeMode").textContent = scene.mode;
      document.getElementById("routeProgress").style.width = `${scene.route}%`;
      document.getElementById("handoffBar").style.width = `${((scene.handoff + 1) / handoffs.length) * 100}%`;
      document.getElementById("actionBtn").textContent = scene.action;
      document.querySelectorAll(".tick").forEach(node => node.classList.toggle("active", Number(node.dataset.scene) === current));
      renderAgents(scene);
      renderHandoffs(scene);
      renderChat(scene);
      renderCards(scene);
    }

    document.getElementById("prevBtn").addEventListener("click", () => {
      current = Math.max(0, current - 1);
      render();
    });

    document.getElementById("nextBtn").addEventListener("click", () => {
      current = Math.min(scenes.length - 1, current + 1);
      render();
    });

    document.getElementById("actionBtn").addEventListener("click", () => {
      if (current < scenes.length - 1) {
        current += 1;
        render();
      }
    });

    makeAgents();
    makeHandoffs();
    makeTimeline();
    render();
  </script>
